<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Celtic Knot Circle -->
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="38"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="28"/>
  <!-- Celtic knot pattern - interlocking loops -->
  <path d="M50 12 Q65 25 65 50 Q65 75 50 88"/>
  <path d="M50 12 Q35 25 35 50 Q35 75 50 88"/>
  <!-- Horizontal weave -->
  <path d="M12 50 Q25 35 50 35 Q75 35 88 50"/>
  <path d="M12 50 Q25 65 50 65 Q75 65 88 50"/>
  <!-- Knot crossings -->
  <path d="M38 38 Q50 32 62 38"/>
  <path d="M38 62 Q50 68 62 62"/>
  <!-- Center embellishment -->
  <circle cx="50" cy="50" r="6"/>
</svg>