<!DOCTYPE html>
<html>
<head>
    <title>Trigger Migration</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Media Migration Trigger</h1>
    <button id="startMigration">Start Migration</button>
    <div id="result"></div>

    <script>
        const supabase = window.supabase.createClient(
            'https://ybxkehyomcakqjvuhnna.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlieGtlaHlvbWNha3FqdnVobm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk3MDg4OTgsImV4cCI6MjA2NTI4NDg5OH0.rVzRKRklmZoWMxZ-jHKfdrvf2uJjtoQuwVjPMb1I7Xw'
        );

        document.getElementById('startMigration').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Starting migration...';
            
            try {
                const { data, error } = await supabase.functions.invoke('migrate-media-to-cloudflare', {
                    body: { 
                        batchSize: 10,
                        resumeFrom: 0 
                    }
                });

                if (error) {
                    resultDiv.innerHTML = `<pre>Error: ${JSON.stringify(error, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<pre>Result: ${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<pre>Failed: ${err.message}</pre>`;
            }
        });
    </script>
</body>
</html>
