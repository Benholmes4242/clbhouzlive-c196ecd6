<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Round header test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #F8FAFC;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      background: #15171F;
      border-radius: 16px;
      padding: 10px 12px 2px;
      margin-bottom: 16px;
      max-width: 420px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 34%;
      background: #334155;
      flex: none;
    }
    .name-col {
      min-width: 0;
      flex: 1;
    }
    .name {
      display: block;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 1px;
      font-size: 12px;
      color: rgba(248,250,252,0.65);
    }
    .score-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
      gap: 2px;
    }
    .score-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .gross {
      position: relative;
      display: inline-block;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }
    .topar {
      position: absolute;
      padding-right: 20px;
      left: calc(100% + 2.5px);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      line-height: 1;
    }
    .net-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }
    .net-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(248,250,252,0.65);
    }
    .net-num {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }
    .chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #22c55e;
      color: #22c55e;
      flex-shrink: 0;
    }
    .right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="label">Over-par (j.edge1994 Sun 30 Aug)</div>
  <div class="card">
    <div class="header">
      <div class="avatar"></div>
      <div class="name-col">
        <div class="name">j.edge1994</div>
        <div class="sub">Sun 30 Aug</div>
      </div>
      <div class="score-col">
        <div class="score-row">
          <span class="gross">
            72
            <span class="topar" style="color: #F87171;">+3</span>
          </span>
          <span class="net-wrap">
            <span class="net-label">NET</span>
            <span class="net-num">72</span>
          </span>
        </div>
      </div>
      <div class="right"><span class="chip">DEAL</span></div>
    </div>
  </div>

  <div class="label">Under-par</div>
  <div class="card">
    <div class="header">
      <div class="avatar"></div>
      <div class="name-col">
        <div class="name">Tommy Fleetwood</div>
        <div class="sub">Today</div>
      </div>
      <div class="score-col">
        <div class="score-row">
          <span class="gross">
            70
            <span class="topar" style="color: #F87171;">−2</span>
          </span>
          <span class="net-wrap">
            <span class="net-label">NET</span>
            <span class="net-num">71</span>
          </span>
        </div>
      </div>
      <div class="right"></div>
    </div>
  </div>

  <div class="label">Level par</div>
  <div class="card">
    <div class="header">
      <div class="avatar"></div>
      <div class="name-col">
        <div class="name">Rory McIlroy</div>
        <div class="sub">Yesterday</div>
      </div>
      <div class="score-col">
        <div class="score-row">
          <span class="gross">
            72
            <span class="topar" style="color: #94a3b8;">E</span>
          </span>
          <span class="net-wrap">
            <span class="net-label">NET</span>
            <span class="net-num">73</span>
          </span>
        </div>
      </div>
      <div class="right"></div>
    </div>
  </div>

  <div class="label">Three-digit gross + long name</div>
  <div class="card">
    <div class="header">
      <div class="avatar"></div>
      <div class="name-col">
        <div class="name">Alexander Jonathan Bartholomew III</div>
        <div class="sub">Mon 31 Aug</div>
      </div>
      <div class="score-col">
        <div class="score-row">
          <span class="gross">
            100
            <span class="topar" style="color: #F87171;">+30</span>
          </span>
          <span class="net-wrap">
            <span class="net-label">NET</span>
            <span class="net-num">71</span>
          </span>
        </div>
      </div>
      <div class="right"><span class="chip">DEAL</span></div>
    </div>
  </div>
</body>
</html>
