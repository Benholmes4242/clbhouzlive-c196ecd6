    <script>
      // Chunk recovery - Must be before main script to catch early errors
      // NOTE: Plain var / function syntax — this inline script runs untranspiled
      // on iOS WebView and must stay compatible.
      var triedReload = false;
      var recoveryAttempts = parseInt(sessionStorage.getItem('chunkRecoveryAttempts') || '0');
      var BOOT_GRACE_MS = 5000;
      var SCRIPT_START_TIME = Date.now();
      // Dev/preview ships hundreds of unbundled modules; production is fast.
      // Use a generous deadline on lovableproject.com / localhost to avoid
      // false-positive reload loops during cold start.
      var __isDevHost = /lovableproject\.com$|localhost|127\.0\.0\.1/.test(location.hostname);
      var ROOT_RENDER_TIMEOUT_MS = __isDevHost ? 30000 : 12000;

      function showFatalRecoveryUI() {
        sessionStorage.removeItem('chunkRecoveryAttempts');
        document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;font-family:system-ui,-apple-system,sans-serif;background:#0A0E14;color:#fff;"><h1 style="font-size:1.5rem;font-weight:600;margin-bottom:1rem;">App couldn\'t start</h1><p style="margin-bottom:2rem;color:#94A3B8;">Try clearing the app and reopening, or check your connection.</p><button id="__lov_reset_btn" style="background:#F7931E;color:#0F172A;border:none;padding:0.75rem 2rem;border-radius:0.5rem;font-size:1rem;font-weight:500;cursor:pointer;">Reset & Reload</button></div>';
        var btn = document.getElementById('__lov_reset_btn');
        if (btn) {
          btn.onclick = function () {
            (async function () {
              try {
                if ('serviceWorker' in navigator) {
                  var regs = await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(function (r) { return r.unregister(); }));
                }
                if (window.caches) {
                  var keys = await caches.keys();
                  await Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }
              } catch (e) {}
              try { localStorage.clear(); } catch (e) {}
              try { sessionStorage.clear(); } catch (e) {}
              location.replace(location.pathname);
            })();
          };
        }
      }

      function runRecoveryReload() {
        (async function () {
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (err) {
            console.error('[Boot Recovery] Error clearing caches:', err);
          } finally {
            var url = new URL(location.href);
            url.searchParams.set('_cb', Date.now().toString());
            location.replace(url.toString());
          }
        })();
      }

      function escalateRecovery(reason) {
        if (triedReload) return;
        triedReload = true;
        recoveryAttempts++;
        sessionStorage.setItem('chunkRecoveryAttempts', recoveryAttempts.toString());
        console.error('[Boot Recovery]', reason, '- attempt', recoveryAttempts);
        if (recoveryAttempts >= 3) {
          showFatalRecoveryUI();
          return;
        }
        runRecoveryReload();
      }

      window.addEventListener('error', function (e) {
        var msg = String((e && e.message) || '');
        var isChunkError =
          msg.includes('ChunkLoadError') ||
          msg.includes('Importing a module script failed') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('Loading chunk');
        var isBootTime = (Date.now() - SCRIPT_START_TIME) < BOOT_GRACE_MS;
        var appAlreadyMounted = window.__APP_MOUNTED__ === true;

        if (!triedReload && (isChunkError || (isBootTime && !appAlreadyMounted))) {
          escalateRecovery(isChunkError ? 'chunk error: ' + msg : 'boot-time error: ' + msg);
        }
      }, true);

      // Catch unhandled promise rejections during boot (e.g. async module init crashes)
      window.addEventListener('unhandledrejection', function (e) {
        var isBootTime = (Date.now() - SCRIPT_START_TIME) < BOOT_GRACE_MS;
        var appAlreadyMounted = window.__APP_MOUNTED__ === true;
        if (!triedReload && isBootTime && !appAlreadyMounted) {
          escalateRecovery('unhandled rejection: ' + String((e && e.reason && e.reason.message) || e.reason || ''));
        }
      });

      // ============================================================
      // RENDER-DEADLINE WATCHDOG
      // If #root is still empty / App not mounted after 7s, force recovery.
      // App.tsx sets window.__APP_MOUNTED__ = true after first commit and
      // calls window.__cancelMountDeadline() to clear this timer.
      // ============================================================
      var MOUNT_DEADLINE = setTimeout(function () {
        var root = document.getElementById('root');
        var hasContent = root && root.children && root.children.length > 0;
        var didMount = window.__APP_MOUNTED__ === true;
        if (hasContent && didMount) {
          sessionStorage.removeItem('chunkRecoveryAttempts');
          return;
        }
        escalateRecovery('React failed to mount within ' + ROOT_RENDER_TIMEOUT_MS + 'ms');
      }, ROOT_RENDER_TIMEOUT_MS);

      window.__cancelMountDeadline = function () {
        clearTimeout(MOUNT_DEADLINE);
        sessionStorage.removeItem('chunkRecoveryAttempts');
      };
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
