  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script>
      // Chunk recovery - Must be before main script to catch early errors
      let triedReload = false;
      window.addEventListener('error', (e) => {
        const msg = String((e && e.message) || '');
        if (!triedReload && (
            msg.includes('ChunkLoadError') ||
            msg.includes('Importing a module script failed') ||
            msg.includes('Failed to fetch dynamically imported module') ||
            msg.includes('Loading chunk'))) {
          triedReload = true;
          console.log('[Chunk Recovery] Detected chunk loading error, clearing caches and reloading...');
          
          (async () => {
            try {
              // Unregister all service workers
              if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              
              // Clear all caches
              if (window.caches) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              }
            } catch (error) {
              console.error('[Chunk Recovery] Error clearing caches:', error);
            } finally {
              location.reload();
            }
          })();
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[SW] Registered successfully');
              
              // Clean cache periodically
              setInterval(() => {
                registration.active?.postMessage({ type: 'CLEAN_CACHE' });
              }, 60 * 60 * 1000); // Every hour
            })
            .catch((error) => {
              console.log('[SW] Registration failed:', error);
            });
        });
      }
    </script>
