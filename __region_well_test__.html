<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Region Well Test</title>
  <style>
    body {
      margin: 0;
      background: #15171F;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #root {
      padding: 24px 16px;
    }
    .measure-bar {
      position: fixed;
      left: 0;
      right: 0;
      height: 1px;
      background: red;
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { I18nextProvider, initReactI18next } from 'react-i18next';
    import i18n from 'i18next';
    import { RegionDropdown, WeekScopePills } from './src/components/explore-tab-new/courseled/WeekFilters.tsx';

    await i18n.use(initReactI18next).init({
      lng: 'en',
      fallbackLng: 'en',
      ns: ['courses'],
      defaultNS: 'courses',
      resources: {
        en: {
          courses: {
            'discover.week.allRegions': 'Everywhere',
            'discover.week.selectRegionA11y': 'Filter rounds by area',
            'discover.week.scopeAria': 'Rounds scope',
            'discover.week.scope.worldwide': 'Worldwide',
            'discover.week.scope.circle': 'Your Circle',
            'discover.week.scope.suggested': 'Suggested',
            'discover.week.scope.top100': 'Top 100',
            'discover.week.scope.played': 'Played',
            'discover.week.areaLabel': 'Area',
          }
        }
      },
      interpolation: { escapeValue: false }
    });

    function Test() {
      const [region, setRegion] = React.useState(null);
      const [scope, setScope] = React.useState('worldwide');
      const regions = {
        total: 23,
        groups: [
          { country: 'Britain & Ireland', count: 16, subs: [
            { sub_country: 'England', count: 9 },
            { sub_country: 'Scotland', count: 4 },
            { sub_country: 'Wales', count: 2 },
            { sub_country: 'Northern Ireland', count: 1 },
          ]},
          { country: 'Continental Europe', count: 7, subs: [
            { sub_country: 'Spain', count: 5 },
            { sub_country: 'Portugal', count: 2 },
          ]},
        ]
      };

      return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
        React.createElement('div', {
          style: {
            display: 'flex',
            flexWrap: 'wrap',
            justifyContent: 'space-between',
            alignItems: 'center',
            gap: 12,
          }
        },
          React.createElement('span', {
            style: { fontSize: 10, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.70)' }
          }, '9 ROUNDS · 5 COURSES · 7 DAYS'),
          React.createElement(RegionDropdown, {
            regions,
            selection: region,
            onChange: setRegion,
          })
        ),
        React.createElement(WeekScopePills, {
          scope,
          onChange: setScope,
        })
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(I18nextProvider, { i18n }, React.createElement(Test)));
  </script>
</body>
</html>
